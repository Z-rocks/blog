name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个发布流程,避免并发切换版本。
concurrency:
  group: production
  cancel-in-progress: false

# 发布只读代码,不需要写权限的令牌。
permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  # 公网验收地址。后台子域名上线后 HTTP 只做跳转或直接断开，
  # 验收必须走 HTTPS 的正式域名，不能再用 http://<IP>/。
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://zrocks.me/' }}

jobs:
  # 发布前的门禁。类型检查和构建只能证明"能编译",证明不了"行为还对":
  # 草稿泄露到前台、列表带上正文这类回归必须由接口测试挡住。
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: blog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 类型检查、构建与接口测试
        env:
          # 测试只连 blog_test,绝不动开发库。
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ""
          TEST_DB_NAME: blog_test
        # 与 CI 流程共用同一份命令,避免两条流水线各跑各的。
        run: bash scripts/verify.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # 只上传源码:node_modules 与 dist 由服务器在版本目录里重新构建。
      - name: 打包并上传
        run: |
          RELEASE_ID="$(date +%Y%m%d-%H%M%S)-g${GITHUB_SHA::7}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          tar czf "/tmp/devlog-$RELEASE_ID.tar.gz" \
            --exclude=node_modules --exclude=dist --exclude=.env \
            README.md backend frontend deploy docs .gitignore .gitattributes
          scp -i ~/.ssh/id_ed25519 "/tmp/devlog-$RELEASE_ID.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/devlog-$RELEASE_ID.tar.gz"

      - name: 服务器构建并切换版本(健康检查失败自动回滚)
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$RELEASE_ID" <<'REMOTE'
            set -euo pipefail
            RELEASE_ID="$1"
            TARBALL="/tmp/devlog-$RELEASE_ID.tar.gz"
            [ -f "$TARBALL" ] || { echo "tar 包不存在"; exit 1; }
            rm -rf /tmp/devlog-ci-bootstrap && mkdir -p /tmp/devlog-ci-bootstrap
            tar xzf "$TARBALL" -C /tmp/devlog-ci-bootstrap deploy/remote/deploy-remote.sh
            tr -d '\r' < /tmp/devlog-ci-bootstrap/deploy/remote/deploy-remote.sh > /usr/local/lib/devlog-remote.sh
            chmod +x /usr/local/lib/devlog-remote.sh
            bash /usr/local/lib/devlog-remote.sh stage "$TARBALL" "$RELEASE_ID"
            bash /usr/local/lib/devlog-remote.sh activate "$RELEASE_ID"
          REMOTE

      - name: 公网验收
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' -m 20 "$PUBLIC_URL")
          echo "$PUBLIC_URL -> HTTP $code"
          [ "$code" = "200" ] || { echo "公网验收失败"; exit 1; }

      - name: 发布摘要
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 部署完成
          - 线上版本:\`${RELEASE_ID}\`
          - 提交:\`${GITHUB_SHA}\`
          - 回滚:服务器执行 \`bash /usr/local/lib/devlog-remote.sh rollback\`,或本地 \`./deploy/rollback.sh\`
          EOF
