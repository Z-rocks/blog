# 此文件应由 nginx.conf 的 http {} include，例如 /etc/nginx/conf.d/devlog.conf。
# 替换 example.com、证书路径和 root；不要直接用本文件覆盖完整 nginx.conf。
limit_req_zone $binary_remote_addr zone=devlog_login:10m rate=5r/m;

# 隐藏 nginx 版本号。gzip 显式开启：本文件是 conf.d 片段，不能假设主配置已写 gzip on，
# 否则下面的 gzip_types 全部静默失效。text/html 由 nginx 自动包含，无需重复声明。
server_tokens off;
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_types application/javascript text/css application/json;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 便于 certbot webroot 续期。签发第一张证书前先只启用这个 HTTP server。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:devlog_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/devlog/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 确认 HTTPS 稳定后再开启 HSTS，避免测试域名被长期锁定。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/auth/login {
        limit_req zone=devlog_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location @login_limited {
        default_type application/json;
        return 429 '{"code":429,"message":"Too many login attempts. Please try again later.","data":null}';
    }

    # proxy_pass 不带末尾 /，保留后端所需的 /api 前缀。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # index.html 不缓存，部署后能取到新 hash 文件。
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # dotfiles 与凭据不应被静态服务暴露。
    location ~ /\. {
        deny all;
    }

    # Vue Router history 模式：刷新 /blog/1 或 /admin/edit/1 不返回 Nginx 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
