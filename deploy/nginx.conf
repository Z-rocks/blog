# DEV.LOG Nginx 站点配置（zrocks.me + adm.zrocks.me）
#
# 安装位置：/etc/nginx/conf.d/devlog.conf（由主配置的 http {} include）。
# 本文件同时被 Certbot 的 nginx 插件管理（ssl_certificate / listen 443 等），
# 但**不会被 CI 自动部署**：deploy-remote.sh 只切换代码版本，不碰 /etc/nginx。
# 修改后必须手动安装并 reload，步骤见 deploy/deploy.md「后台子域名」一节。
#
# 两个站点共用同一份前端产物（/var/www/devlog/frontend/dist）与同一个后端：
#   zrocks.me / www.zrocks.me  —— 公开站，后台入口一律 404
#   adm.zrocks.me              —— 后台站，前面再套一层 HTTP Basic Auth
# 之所以能共用一份 dist，是因为隔离做在 Nginx 与接口层，前端不需要知道自己
# 被哪个域名服务，本地开发（localhost:5173）也就不需要任何特殊分支。

limit_req_zone $binary_remote_addr zone=devlog_login:10m rate=5r/m;

# 隐藏 nginx 版本号。gzip 在主配置 /etc/nginx/nginx.conf 里已经打开，
# 这里再显式写一次：本文件是 conf.d 片段，若被复制到别处而那边没开 gzip，
# 下面的 gzip_types 会静默失效。text/html 由 nginx 自动包含，无需声明。
server_tokens off;
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_types application/javascript text/css application/json;

# ---------------------------------------------------------------------------
# 80 端口：ACME 校验通道 + 未知 Host 拒绝
# ---------------------------------------------------------------------------

# 默认 server：不认识域名就直接断开（含"直接用 IP 访问"）。
# 以前这里是 default_server 并且直接返回站点内容，等于把登录接口也暴露在
# 明文 HTTP 上；现在 HTTP 不再提供任何页面。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 续期走 webroot，必须能在任何 Host 下命中校验文件。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    return 444;
}

# 已知域名：校验目录放行，其余 301 到 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name zrocks.me www.zrocks.me adm.zrocks.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 公开站：zrocks.me / www.zrocks.me
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zrocks.me www.zrocks.me;

    ssl_certificate /etc/letsencrypt/live/zrocks.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zrocks.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/devlog/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 确认 HTTPS 稳定后再开启 HSTS，避免域名被长期锁定。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 后台入口只存在于 adm 子域名。这里一律返回 404 而不是 403：
    # 403 等于确认"这个路径确实有东西"，404 什么都不透露。
    location = /login { return 404; }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    # 拦截必须发生在 /api/ 之前：nginx 取最长前缀，/api/admin/ 比 /api/ 长。
    location = /api/auth/login { return 404; }
    location ^~ /api/admin/ { return 404; }

    # 公开接口：只读，仅已发布文章。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # index.html 不缓存，部署后能取到新 hash 文件。
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # dotfiles 与凭据不应被静态服务暴露。
    location ~ /\. {
        deny all;
    }

    # Vue Router history 模式：刷新 /blog/1 不返回 Nginx 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# 后台站：adm.zrocks.me
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adm.zrocks.me;

    ssl_certificate /etc/letsencrypt/live/zrocks.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zrocks.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/devlog/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ACME 校验必须豁免 Basic Auth，否则续期会拿到 401、证书静默过期。
    # 注意还有第二道保险：续期用的是 webroot 而不是 --nginx 插件，
    # 插件会往 server 块里插一个 location，那个 location 不带 auth_basic off。
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 第二道门：在 JWT 登录之前先要 Basic 凭据。
    # 覆盖整站（含 /api/），凭据由浏览器缓存，SPA 的 XHR 会自动带上。
    # 代价是浏览器重启后第一次请求会弹一次原生登录框。
    auth_basic "DEV.LOG Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-devlog;

    # 登录限流只留在后台站：公开站已经没有登录入口了。
    location = /api/auth/login {
        limit_req zone=devlog_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location @login_limited {
        default_type application/json;
        return 429 '{"code":429,"message":"Too many login attempts. Please try again later.","data":null}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
